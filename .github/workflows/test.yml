name: Tester les exemples
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: npm test dans chaque exemple
        run: |
          for d in le-code/*/; do
            echo "== $d"; (cd "$d" && npm install --no-audit --no-fund && npm test) || exit 1
          done
